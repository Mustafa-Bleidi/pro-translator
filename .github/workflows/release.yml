name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip (contains pro-translator/SKILL.md)
        run: |
          mkdir -p dist
          zip -r dist/pro-translator.zip pro-translator -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/pro-translator.zip
